<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Animal Care</title>
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">

    <!-- Encabezado / Navbar -->
    <header class="navbar navbar-expand-lg navbar-dark bg-success px-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="../index.html">
                <h1 class="h3 m-0">Animal Care</h1>
                <small class="text-white-50 fs-6">Contacto</small>
            </a>
            <nav>
                <ul class="navbar-nav flex-row gap-3">
                    <li class="nav-item"><a class="nav-link text-white" href="../index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link text-white active" href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Contenido Principal: Formulario de Contacto -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm p-4">
                    <h2 class="text-center text-success fw-bold mb-4">Ponte en Contacto</h2>
                    <form>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre del propietario</label>
                            <input type="text" class="form-control" id="nombre" required placeholder="Ej. Juan Pérez">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" required placeholder="correo@ejemplo.com">
                        </div>
                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Mensaje o motivo de consulta</label>
                            <textarea class="form-control" id="mensaje" rows="4" required placeholder="Escribe tu mensaje aquí..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Enviar Mensaje</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="m-0">&copy; 2026 Animal Care. Todos los derechos reservados.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
