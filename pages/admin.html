<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes - Animal Care</title>
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">

    <!-- Encabezado / Navbar -->
    <header class="navbar navbar-expand-lg navbar-dark bg-success px-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="../index.html">
                <h1 class="h3 m-0">Animal Care</h1>
                <small class="text-white-50 fs-6">Control de Pacientes</small>
            </a>
            <nav>
                <ul class="navbar-nav flex-row gap-3">
                    <li class="nav-item"><a class="nav-link text-white" href="../index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="contacto.html">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link text-white active" href="admin.html">Pacientes</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Contenido Principal: Registro y Control de Pacientes con LocalStorage -->
    <main class="container my-5">
        <h2 class="text-center text-success fw-bold mb-4">Registro de Ingreso de Pacientes</h2>
        
        <div class="row g-4">
            <!-- Formulario de Registro -->
            <div class="col-md-4">
                <div class="card shadow-sm p-3">
                    <h3 class="h5 text-success mb-3">Nuevo Ingreso</h3>
                    <form id="formPaciente">
                        <div class="mb-3">
                            <label for="nombreMascota" class="form-label">Nombre de la Mascota</label>
                            <input type="text" class="form-control" id="nombreMascota" required placeholder="Ej. Firulais">
                        </div>
                        <div class="mb-3">
                            <label for="especie" class="form-label">Especie</label>
                            <select class="form-select" id="especie" required>
                                <option value="Perro">Perro</option>
                                <option value="Gato">Gato</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="sintomas" class="form-label">Motivo de consulta</label>
                            <input type="text" class="form-control" id="sintomas" required placeholder="Ej. Vacunación anual">
                        </div>
                        <button type="submit" class="btn btn-success w-100">Registrar Paciente</button>
                    </form>
                </div>
            </div>

            <!-- Tabla de Consulta (CRUD LocalStorage) -->
            <div class="col-md-8">
                <div class="card shadow-sm p-3">
                    <h3 class="h5 text-success mb-3">Pacientes en Clínica</h3>
                    <div class="table-responsive">
                        <table class="table table-striped align-middle">
                            <thead>
                                <tr>
                                    <th>Mascota</th>
                                    <th>Especie</th>
                                    <th>Motivo</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaPacientes">
                                <!-- Se llena mediante JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="m-0">&copy; 2026 Animal Care. Todos los derechos reservados.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
